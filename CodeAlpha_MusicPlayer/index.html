<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./icons8-music-32.png">
    <title>Music Player</title>
</head>
<body>
    <div class="wrapper">
        <div class="parallax-container">
            <div class="parallax-glow glow-1"></div>
            <div class="parallax-glow glow-2"></div>
            <div class="parallax-glow glow-3"></div>
        </div>

        <audio id="audio" src="./assets/music/alec_koff-carnaval.mp3"></audio>

        <div class="play-list-container">
            <h2>Play List</h2>
            <ul class="play-list"></ul>
        </div>

        <div class="player">

            <div class="songs-img-container">
                <img src="./assets/songsImg/ai-generated-vintage.jpg" class="song-img" alt="Song Image">
            </div>

            <div class="song-info">
                <h1></h1>
                <p></p>
            </div>

            <div class="action-bar">
                <div class="action-bar-item" data-control="like">
                    <img src="./assets/like.svg" class="action-bar-icon" alt="Like">
                </div>
                <div class="action-bar-item" data-control="share">
                    <img src="./assets/share.svg" class="action-bar-icon" alt="Share">
                </div>
                <div class="action-bar-item" data-control="download">
                    <img src="./assets/download.svg" class="action-bar-icon" alt="Download">
                </div>
            </div>

            <div class="song-progress">
                <input type="range" class="song-progress-bar" min="0" max="100" value="0" step="0.1">

                <div class="time-container">
                    <div class="song-progress-time"></div>
                    <div class="song-progress-time-end"></div>
                </div>
            </div>

            <div class="song-controls">

                <div class="song-control-repeat" data-control="repeat">
                    <img src="./assets/replay.svg" class="controls-icon" alt="Repeat">
                </div>

                <div class="song-control-prev" data-control="prev">
                    <img src="./assets/previous-track.svg" class="controls-icon" alt="Previous">
                </div>

                <div class="song-control-play-pause" data-control="play">
                    <img src="./assets/play.svg" class="controls-icon play" alt="Play">
                    <img src="./assets/pause.svg" class="controls-icon pause" alt="Pause">
                </div>

                <div class="song-control-next" data-control="next">
                    <img src="./assets/next-track.svg" class="controls-icon" alt="Next">
                </div>

                <div class="song-control-volume" data-control="volume">
                    <img src="./assets/speaker.svg" class="controls-icon" alt="Volume">
                    <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="1">
                </div>

            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
