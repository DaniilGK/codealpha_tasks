<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./icons8-music-32.png">
    <title>Music Player</title>
</head>
<body>

    <div class="wrapper">
        <audio id="audio" src="./assets/music/alec_koff-carnaval.mp3"></audio>

        <div class="player">

            <div class="songs-img-container">
                <img src="./assets/songsImg/phonk.jpg" class="song-img" alt="Song Image">
            </div>

            <div class="song-info">
                <h1>Song Name</h1>
                <p>Artist Name</p>
            </div>

            <div class="action-bar">
                <div class="action-bar-item">
                    like
                </div>
                <div class="action-bar-item">
                    share
                </div>
                <div class="action-bar-item">
                    download
                </div>
            </div>

            <div class="song-progress">
                <input type="range" class="song-progress-bar" min="0" max="100" value="0" step="0.1">

                <div class="time-container">
                    <div class="song-progress-time">00:00</div>
                    <div class="song-progress-time-end">03:45</div>
                </div>
            </div>

            <div class="song-controls">

                <div class="song-control-repeat">
                    <img src="./assets/replay.svg" class="controls-icon" data-control="repeat" alt="Repeat">
                </div>

                <div class="song-control-prev">
                    <img src="./assets/previous-track.svg" class="controls-icon" data-control="prev" alt="Previous">
                </div>

                <div class="song-control-play-pause">
                    <img src="./assets/play.svg" class="controls-icon play" data-control="play" alt="Play">
                    <img src="./assets/pause.svg" class="controls-icon pause" data-control="pause" alt="Pause">
                </div>

                <div class="song-control-next">
                    <img src="./assets/next-track.svg" class="controls-icon" data-control="next" alt="Next">
                </div>

                <div class="song-control-volume">
                    <img src="./assets/speaker.svg" class="controls-icon" data-control="volume" alt="Volume">
                    <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="1">
                </div>

            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
